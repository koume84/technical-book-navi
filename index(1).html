const questions=[

 {title:'「アルゴリズム」「API」「機械学習」「ニューラルネットワーク」などの言葉をどの程度理解できますか？',options:[['ほとんど分からない',0],['聞いたことがある',1],['だいたい説明できる',2],['実際に使ったことがある',3]]}
];
let step=0, answers=[], chosenLevel=2, chosenCategory='すべて';
function show(id){['home','diagnosis','results'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));window.scrollTo({top:0,behavior:'smooth'})}
function goHome(){show('home')}
function startDiagnosis(){step=0;answers=[];show('diagnosis');renderQuestion()}
function renderQuestion(){const q=questions[step];document.getElementById('bar').style.width=((step+1)/questions.length*100)+'%';document.getElementById('questionArea').innerHTML=`<div class="eyebrow">QUESTION ${step+1} / ${questions.length}</div><h1>${q.title}</h1><div class="options">${q.options.map((o,i)=>`<button class="option ${answers[step]===o[1]?'selected':''}" onclick="choose(${o[1]})"><b>${o[0]}</b></button>`).join('')}</div><div class="actions">${step?'<button class="secondary" onclick="backQuestion()">← 戻る</button>':'<span></span>'}<button class="primary" style="margin:0" onclick="nextQuestion()">${step===questions.length-1?'結果を見る':'次へ →'}</button></div>`}
function choose(v){answers[step]=v;renderQuestion()}
function backQuestion(){step--;renderQuestion()}
function nextQuestion(){if(answers[step]===undefined){alert('回答を1つ選んでください。');return}if(step<questions.length-1){step++;renderQuestion()}else{finishDiagnosis()}}
function finishDiagnosis(){const total=answers.reduce((a,b)=>a+b,0);chosenLevel=total<=2?1:total<=5?2:total<=7?3:4;show('results');document.getElementById('levelNumber').textContent='Lv.'+chosenLevel;document.getElementById('levelName').textContent=levelNames[chosenLevel];document.getElementById('resultSummary').textContent=`診断結果はLv.${chosenLevel}「${levelNames[chosenLevel]}」。レベルに近い本を中心に、分野を選ぶとさらに絞り込めます。`;buildFilters();renderBooks()}
function buildFilters(){const cats=[...new Set(books.flatMap(b=>b.category))].sort();document.getElementById('filters').innerHTML=['すべて',...cats].map(c=>`<button class="filter ${chosenCategory===c?'active':''}" onclick="setCategory('${escapeAttr(c)}')">${c}</button>`).join('')}
function escapeAttr(s){return s.replaceAll('&','&amp;').replaceAll("'",'&#39;').replaceAll('"','&quot;').replaceAll('<','&lt;')}
function setCategory(c){chosenCategory=c;buildFilters();renderBooks()}
function scoreBook(b){let s=Math.abs(b.level-chosenLevel)*-3;if(b.level===chosenLevel)s+=8;if(b.level===chosenLevel-1||b.level===chosenLevel+1)s+=3;if(chosenCategory!=='すべて'&&b.category.includes(chosenCategory))s+=10;return s}
function renderBooks(){let arr=books.filter(b=>chosenCategory==='すべて'||b.category.includes(chosenCategory)).map(b=>({...b,score:scoreBook(b)})).sort((a,b)=>b.score-a.score);const grid=document.getElementById('bookGrid');document.getElementById('recommendTitle').textContent=chosenCategory==='すべて'?'あなたに合いそうな本':'「'+chosenCategory+'」のおすすめ';if(!arr.length){grid.innerHTML='<div class="empty">この分野の本はまだ登録されていません。</div>';return}grid.innerHTML=arr.slice(0,12).map(b=>`<article class="book"><div class="meta"><span class="level">Lv.${b.level} ${b.level_name}</span></div><h3>${b.title}</h3><p>${b.target}</p><div class="reason"><b>おすすめ理由</b><br>${b.reason}</div><button onclick="openDetail('${b.id}')">詳しく見る →</button></article>`).join('')}
function openDetail(id){const b=books.find(x=>x.id===id);if(!b)return;document.getElementById('dLevel').textContent='Lv.'+b.level+' '+b.level_name;document.getElementById('dTitle').textContent=b.title;document.getElementById('dCats').innerHTML=b.category.map(c=>`<span class="pill">${c}</span>`).join('');document.getElementById('dTarget').textContent=b.target;document.getElementById('dPrereq').textContent=b.prerequisites.join(' / ');document.getElementById('dPurpose').textContent=b.purpose;document.getElementById('dReason').textContent=b.reason;document.getElementById('detail').classList.remove('hidden')}
function closeDetail(){document.getElementById('detail').classList.add('hidden')}
</script></body></html>
